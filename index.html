function save(s){
  const data=JSON.stringify(s);
  // Same URL + same key means an index.html update does NOT erase progress.
  localStorage.setItem(STATE_KEY,data);
  localStorage.setItem(SAFETY_KEY,data);
}
let state=getState(); if(!state.seen)state.seen={}; if(!state.wrongCount)state.wrongCount={}; let session=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function today(){return new Date().toISOString().slice(0,10)}
function isUnlocked(k){
  if(k==="lv1"||k==="showa"||k==="kobun") return true;
  const i=MAIN.indexOf(k); return i>0 && state.completed[MAIN[i-1]];
}
function countToday(){return state.logs.filter(x=>x.date===today()).length}
function accuracy(){if(!state.logs.length)return 0; return Math.round(state.logs.filter(x=>x.ok).length/state.logs.length*100)}
function trophies(){return Object.keys(state.completed).length}
function home(){
  const items=KEYS.map(k=>{
    const c=COURSES[k], open=isUnlocked(k), done=state.completed[k];
    return `<div class="course ${open?"":"locked"}">
      <div><span class="badge">${k.startsWith("lv")?"MAIN":"EX"}</span>
      <h3>${done?c.trophy+" ":""}${c.title}</h3><p>${c.subtitle}　全${COURSES[k].questions.length}問</p>
      <p style="margin-top:5px">${new Set(state.logs.filter(l=>l.course===k&&l.ok).map(l=>l.qid)).size} / ${COURSES[k].questions.length} 正解済み</p></div>
      <button class="go" ${open?"":"disabled"} onclick="${open?`startSet('${k}')`:""}">${done?"もう1セット":open?"10問スタート":"🔒"}</button>
    </div>`
  }).join("");
  document.getElementById("app").innerHTML=`
  <div class="top"><div class="brand">国語クエスト v3</div><button class="menuBtn" onclick="openMenu()">☰</button></div>
  <div class="homeTitle">今日も10問いこう 📚</div>
  <div class="sub">1セット10問。未出題を優先するから、一周するまでは原則かぶらないよ。</div>
  <div class="stats"><div class="stat"><b>${countToday()}</b>今日の回答</div><div class="stat"><b>${accuracy()}%</b>総正答率</div><div class="stat"><b>${trophies()}</b>トロフィー</div></div>
  ${items}`;
}
function startSet(key){
  const qs=COURSES[key].questions.map((x,i)=>({x,i}));
  const seen=new Set(state.seen[key]||[]);
  let unseen=qs.filter(o=>!seen.has(o.i));
  let chosen=[];
  if(unseen.length>=10){
    chosen=shuffle(unseen).slice(0,10);
  }else{
    chosen=shuffle(unseen).slice();
    const used=new Set(chosen.map(o=>o.i));
    const wc=state.wrongCount[key]||{};
    let rest=qs.filter(o=>!used.has(o.i)).sort((a,b)=>(wc[b.i]||0)-(wc[a.i]||0));
    let top=rest.slice(0,Math.min(30,rest.length));
    shuffle(top);
    for(const o of top){if(chosen.length<10&&!used.has(o.i)){chosen.push(o);used.add(o.i)}}
    if(chosen.length<10){
      for(const o of shuffle(rest.filter(o=>!used.has(o.i)))){if(chosen.length<10)chosen.push(o)}
    }
  }
  session={key,items:chosen,pos:0,score:0,wrong:[],answered:false,setNo:(state.sets[key]||0)+1};
  renderQ();
}
function renderQ(){
  const c=COURSES[session.key], obj=session.items[session.pos], x=obj.x;
  const opts=x.slice(1,5).map((t,i)=>({t,correct:i===0})); shuffle(opts);
  session.currentOpts=opts; session.answered=false;
  document.getElementById("app").innerHTML=`
  <div class="quiz">
    <div class="top"><div><span class="badge">${c.title}</span> <span class="progress">${session.pos+1}/${session.items.length}</span></div><button class="menuBtn" onclick="openMenu()">☰</button></div>
    <div class="question">${x[0]}</div>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${letters[i]}</span><span>${o.t}</span></button>`).join("")}</div>
    <div class="explain" id="explain"><div class="small">答えをタップすると、正解でも解説が表示されます。</div></div>
    <button class="next" id="next" disabled onclick="nextQ()">${session.pos===session.items.length-1?"結果を見る":"次へ"}</button>
  </div>`;
}
function answer(i){
  if(session.answered)return; session.answered=true;
  const obj=session.items[session.pos], x=obj.x, opts=session.currentOpts, ok=opts[i].correct;
  const btn=[...document.querySelectorAll(".choice")];
  btn.forEach((b,j)=>{b.disabled=true;if(opts[j].correct)b.classList.add("correct")});
  if(!ok)btn[i].classList.add("wrong"); else session.score++;
  if(!ok)session.wrong.push(obj);
  if(!state.seen[session.key])state.seen[session.key]=[];
  if(!state.seen[session.key].includes(obj.i))state.seen[session.key].push(obj.i);
  if(!state.wrongCount[session.key])state.wrongCount[session.key]={};
  if(!ok)state.wrongCount[session.key][obj.i]=(state.wrongCount[session.key][obj.i]||0)+1;
  state.logs.push({date:today(),ts:Date.now(),course:session.key,qid:obj.i,ok});
  save(state);
  document.getElementById("explain").innerHTML=`<div class="result">${ok?"✅ 正解":"❌ ちがうよ〜〜"}</div><div>${x[5]}</div>`;
  document.getElementById("next").disabled=false;
}
function nextQ(){
  if(session.pos<session.items.length-1){session.pos++;renderQ()} else finish();
}
function finish(){
  state.sets[session.key]=(state.sets[session.key]||0)+1;
  const fullCourseDone = COURSES[session.key].questions.every((q,idx)=>state.logs.some(l=>l.course===session.key&&l.qid===idx&&l.ok));
  if(fullCourseDone) state.completed[session.key]=true;
  save(state);
  const c=COURSES[session.key], wrongUnique=[...new Map(session.wrong.map(o=>[o.i,o])).values()];
  document.getElementById("app").innerHTML=`
  <div class="top"><div class="brand">${c.title}</div><button class="menuBtn" onclick="openMenu()">☰</button></div>
  <div class="center">
    <div class="bigTrophy">${fullCourseDone?c.trophy:"🎯"}</div>
    <div class="score">${session.score} / ${session.items.length}</div>
    <div class="sub">${fullCourseDone?c.message:"1セット終了！"}</div>
    ${wrongUnique.length?`<div class="note">間違い ${wrongUnique.length}問。ここだけすぐ復習できます。</div>`:""}
    <div class="actionGrid">
      ${wrongUnique.length?`<button class="next" onclick="retryWrong()">間違いだけ復習</button>`:""}
      <button class="next" onclick="startSet('${session.key}')">もう1セット（10問）</button>
      <button class="next secondary" onclick="home()">コース一覧へ</button>
    </div>
  </div>`;
}
function retryWrong(){
  const uniq=[...new Map(session.wrong.map(o=>[o.i,o])).values()];
  if(!uniq.length)return;
  shuffle(uniq);
  session={...session,items:uniq,pos:0,score:0,wrong:[]};
  renderQ();
}
function makeBackupText(){
  return JSON.stringify({
    app:"kokugo-quest-v3",
    version:3,
    exportedAt:new Date().toISOString(),
    state:state
  });
}
async function copyBackup(){
  const data=makeBackupText();
  try{
    await navigator.clipboard.writeText(data);
    alert("バックアップをコピーしたよ！\\nSafariなど別のブラウザで「バックアップから復元」を押して貼り付けてね。");
  }catch(e){
    // Clipboard permission can be restricted in some in-app browsers.
    window.prompt("この文字列をすべてコピーしてね",data);
  }
}
function restoreBackup(){
  const pasted=window.prompt("コピーしたバックアップを貼り付けてね");
  if(!pasted)return;
  try{
    const parsed=JSON.parse(pasted.trim());
    const restored=(parsed && parsed.app==="kokugo-quest" && parsed.state) ? parsed.state : parsed;
    if(!restored || !Array.isArray(restored.logs) || typeof restored.completed!=="object" || typeof restored.sets!=="object"){
      throw new Error("invalid");
    }
    if(!confirm("このバックアップの学習記録に復元しますか？\\n今このブラウザにある記録は上書きされます。"))return;
    state=restored;
    save(state);
    closeMenu();
    home();
    alert("復元できたよ！📚");
  }catch(e){
    alert("バックアップを読み込めなかったよ。コピーした文字列が途中で切れていないか確認してね。");
  }
}
function exportData(){
  const blob=new Blob([makeBackupText()],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kokugo-quest-v3-backup.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function resetData(){
  if(confirm("v3の学習記録をすべて消して最初からやり直しますか？\\nこの操作は元に戻せません。先にバックアップがおすすめです。")){
    localStorage.removeItem(STATE_KEY);
    localStorage.removeItem(SAFETY_KEY);
    state=getState();
    closeMenu();
    home();
  }
}
function openMenu(){
  document.getElementById("panel").innerHTML=`
    <h3>メニュー</h3>
    <button onclick="closeMenu();home()">🏠 コース一覧</button>
    <button onclick="copyBackup()">📋 バックアップをコピー</button>
    <button onclick="restoreBackup()">📥 バックアップから復元</button>
    <button onclick="exportData()">💾 JSONでバックアップ保存</button>
    <button onclick="alert('JSONをお母さんのChatGPTに送れば、正答率・苦手分野・復習状況などを分析できます')">📊 学習記録の分析について</button>
    <button onclick="resetData()">🗑 学習記録をリセット</button>
    <button onclick="closeMenu()">閉じる</button>`;
  document.getElementById("sheet").classList.add("open");
}
function closeMenu(){document.getElementById("sheet").classList.remove("open")}
home();
</script>
</body>
</html>
