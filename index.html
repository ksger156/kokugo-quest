代語の『いる』とは違う。"], ["かこつ", "嘆く・不平を言う", "色が変わる・心変わりする", "不思議だ・身分が低い", "冷淡だ・平然としている", "何かのせいにして嘆く。"], ["たのむ", "頼りにする・あてにする", "驚きあきれるほどだ", "趣がある・興味深い", "腹立たしい・悔しい", "お願いするだけでなく、信頼し頼みにする。"], ["見ゆ", "見える・思われる・結婚する", "腹立たしい・悔しい", "つらい・心細い", "大声で騒ぐ・評判になる", "文脈により複数の意味がある。"]]}, "lv6": {"title": "LV6 複合感情", "subtitle": "一つに決めつけず、混ざった感情を読む", "trophy": "🔥🥉", "message": "複合感情ステージクリア！", "questions": [["大会で優勝した姉を家族みんなが囲んだ。弟も『すごいね』と笑って拍手したが、その夜、自分の机に戻ると、途中まで書いた応募用紙をしばらく見つめてから引き出しにしまった。", "姉を祝う気持ちと、自分も結果を出したいという焦りが入り混じっている。", "姉の成功を素直に喜べず、強い敵意だけを抱いている。", "応募すること自体に興味を失い、完全にあきらめている。", "家族に褒められなかったことだけに腹を立てている。", "拍手は祝福を、応募用紙を見つめてしまう行動は自分への焦りを示す。感情は一つとは限らない。"], ["転校する友人に『向こうでも頑張れよ』と言った彼は、最後まで冗談を言って笑わせた。けれど駅で別れたあと、友人からもらった消しゴムをポケットから出し、またしまった。", "別れを明るく受け止めようとしながら、寂しさも抱えている。", "友人の転校を歓迎しており、寂しさはほとんどない。", "消しゴムを返し忘れたことだけを気にしている。", "冗談を言ったことを後悔し、罪悪感だけを抱いている。", "人前では明るく振る舞い、別れた後に思い出の品へ触れている。明るさと寂しさの両方を読む。"], ["発表会で失敗した彼女に、先生は『よく最後まで続けたね』と言った。彼女はうなずいたが、帰宅すると録画を最初から再生し、失敗した場面で何度も止めた。", "認められて少し救われつつも、悔しさが残り次に生かそうとしている。", "先生の評価に納得できず、先生への反発だけが強まっている。", "失敗を忘れるため、録画を楽しんで見ている。", "失敗したことを恥じ、二度と発表したくないと決めている。", "先生の言葉は救いになる一方、録画を見直す行動は悔しさと改善意欲を示す。"], ["父に進路を認めてもらった彼は『ありがとう』と言った。しかし自室へ戻ると、机の上の資料を一度全部閉じ、しばらく天井を見た。", "認められて安心した一方、選んだ進路への責任の重さも感じている。", "父に認められたことで不安は完全になくなった。", "進路への興味がなくなり、勉強をやめようとしている。", "父がもっと褒めてくれなかったことに不満を感じている。", "安心の直後に動きが止まる描写から、喜びだけでなく責任や緊張も生じたと読める。"], ["試合に負けた友人が『今日は完敗だな』と笑った。彼も笑い返したが、帰り道では友人より半歩後ろを歩き、何度も何か言いかけてやめた。", "励ましたいが、軽い言葉では傷つけるかもしれないとためらっている。", "敗戦を面白がっており、友人をからかいたいと思っている。", "友人と歩くこと自体が嫌で、距離を取ろうとしている。", "試合結果には関心がなく、別のことを考えている。", "言いかけてやめる反復は、相手を気遣い言葉を選ぶ迷いを示す。"], ["母から昔の写真を渡された彼女は『こんなのまだ取ってたの？』と笑った。だが写真を返さず、自分の机の引き出しにそっと入れた。", "照れながらも、写真や思い出を大切に感じている。", "古い写真が邪魔なので、あとで捨てようとしている。", "母が勝手に保存していたことに怒っている。", "写真の内容を忘れており、確認のために保管しただけである。", "言葉は軽いが、返さず丁寧にしまう行動は愛着を示す。"], ["第一志望に合格した彼は、報告を聞いた瞬間には『やった』と叫んだ。ところが数分後、急に静かになり、落ちた友人へ送るメッセージを何度も書き直した。", "自分の喜びと、友人への気遣いの間で揺れている。", "合格した実感を失い、うれしくなくなっている。", "友人より良い結果だったことを自慢したいと思っている。", "友人から祝福されなかったことに腹を立てている。", "自分の喜びはあるが、友人の状況を意識して表現を調整している。"], ["祖母の家を売る話が決まった。彼は『仕方ないよね』と言い、片づけも手伝ったが、最後に柱の傷だけ写真に撮った。", "現実には納得しながらも、思い出を失う寂しさを感じている。", "売却に強く反対しており、家族に怒りを向けている。", "柱の傷を修理業者に見せるため記録しただけである。", "家そのものには思い入れがなく、作業を早く終えたいと思っている。", "『仕方ない』という受容と、痕跡を残す行為から寂しさも読み取れる。"], ["弟が初めて一人で電車に乗る日、姉は『子どもじゃないんだから大丈夫でしょ』と言った。けれど発車時刻になるまで、何度も乗換案内を確認していた。", "弟の成長を認めつつ、失敗しないか心配している。", "弟を信用しておらず、一人で行かせたことに怒っている。", "電車が好きなので時刻表を見ることを楽しんでいる。", "自分も同じ電車に乗りたくて予定を調べている。", "言葉では自立を認めながら、確認行動に心配が表れている。"], ["先生に答案を褒められた彼女は『たまたまです』と答えた。その日の帰宅後、いつもより早く次の問題集を開いた。", "照れや謙遜を見せつつ、評価を励みに意欲が高まっている。", "褒められたことを疑い、先生の採点ミスを探している。", "成績に興味がなく、偶然勉強を始めただけである。", "評価への不満から、先生を見返そうと怒っている。", "口では控えめだが、その後の行動が前向きな動機づけを示す。"], ["長く入院していた友人が退院した。彼は『やっと遊べるな』と軽く言ったが、友人が階段を上る時だけ、何も言わず少し後ろを歩いた。", "再会の喜びと、友人の体調への気遣いが同時にある。", "友人の歩く速さにいら立ち、急かしたいと思っている。", "階段で転ぶ様子を面白がって見ている。", "退院を喜んでいるだけで、体調には注意を向けていない。", "軽い言葉の一方、位置取りには支えられるようにする配慮がにじむ。"], ["卒業式で担任に『泣くなよ』と笑われ、彼は『先生こそ』と返した。教室を出る時、誰もいない黒板を一度振り返った。", "別れを笑いでごまかしながら、名残惜しさを感じている。", "担任にからかわれたことだけを不快に思っている。", "黒板に忘れ物がないか確認しただけである。", "卒業できる安心感だけを味わっている。", "軽口の後の振り返りが、別れへの未練を示す。"], ["発表役を譲ってくれた友人に彼女は『助かった』と言った。ところが本番後、友人が褒められているのを見て、拍手しながら少し視線を落とした。", "感謝しつつ、自分も挑戦すればよかったという悔しさがある。", "友人に役を奪われたと感じ、強く憎んでいる。", "発表自体に興味がなく、拍手も形式的である。", "友人の発表が失敗したと思い、気まずく感じている。", "譲ってもらった感謝と、結果を見た後の自分への悔いが両立する。"], ["父から古い万年筆をもらった彼は『使いにくそう』と言った。しかし翌日、学校へ持って行く筆箱の中にそれを入れた。", "素直に喜びを示せないが、贈り物を大切に使いたいと思っている。", "実用性だけを重視し、父の気持ちは気にしていない。", "父に返すため、学校へ持っていこうとしている。", "新しい文房具を買えなかったことに不満を抱いている。", "言葉の評価より、実際に持ち歩く選択が本心を示している。"], ["チームの主将を外された彼は『まあ、あいつの方が向いてる』と言った。練習が始まると、誰より大きな声で新主将に指示を伝えた。", "悔しさを抱えながらも、チームを支えようとしている。", "主将への未練は全くなく、交代を心から歓迎している。", "新主将を失敗させようと、わざと指示を増やしている。", "練習への関心を失い、形式的に参加している。", "自分の立場への悔しさと、チームへの責任感は同時に存在しうる。"], ["引っ越し前夜、彼女は『新しい学校、楽しみ』と話した。箱詰めを終えたあと、壁から外した友人との写真だけは段ボールに入れず、枕元に置いた。", "新生活への期待と、今の友人と離れる寂しさが混ざっている。", "新しい学校へ行くことを本当は完全に嫌がっている。", "写真を荷造りし忘れただけで、特別な意味はない。", "友人関係に疲れ、新しい環境だけを望んでいる。", "未来への期待と現在への愛着を、台詞と写真の扱いがそれぞれ示す。"], ["弟に貸した本を汚された彼は『もういいよ』と言った。その後、本棚に戻す前に破れたページを丁寧にテープで直した。", "弟を責め続けたくはないが、本を大切にしていたため残念さはある。", "本が嫌いになったので、処分する準備をしている。", "弟への怒りは完全に消え、何も気にしていない。", "直すこと自体を楽しんでおり、汚れは気にならない。", "許す意思と、大切な物を傷つけられた残念さは両立する。"], ["祖父の話を聞くのを面倒がっていた彼は、祖父が入院してから『また同じ話だよ』と笑いながら、昔聞いた内容を母に細かく話した。", "以前は面倒に感じても、今は祖父との時間を大切に思い返している。", "祖父の話をからかうために細部まで覚えていた。", "祖父への関心はなく、記憶力を自慢している。", "母が知らないことに優越感を感じているだけである。", "以前の態度と現在の回想の丁寧さの差から、価値の感じ方が変化したと読める。"], ["受賞を逃した彼女は『次、頑張る』と笑った。家に帰ると賞の発表ページを閉じたが、その直後に練習ノートを開いた。", "悔しさを抱えつつ、気持ちを次の挑戦へ切り替えようとしている。", "結果に無関心で、受賞を目指す気持ちを失っている。", "受賞者への嫉妬だけが強く、練習はその人に勝つためだけである。", "発表ページを見るのが面倒になっただけである。", "結果から目を離し、練習へ向かう動作は、悔しさを行動へ変えようとする姿勢を示す。"], ["久しぶりに会った友人から『変わったね』と言われ、彼は『そっちこそ』と笑った。別れたあと、駅の鏡に映る自分を少し長く見た。", "再会を楽しみつつ、自分の変化を意識させられて戸惑っている。", "友人の外見を批判したことを反省しているだけである。", "鏡を見る習慣があるため、会話とは関係がない。", "自分が以前より優れていると確認し、満足している。", "友人の一言が、本人に自分の変化を考えさせたと読むのが自然。"]]}, "lv7": {"title": "LV7 本音と建前", "subtitle": "言葉と行動のズレから本心を読む", "trophy": "🔥🥈", "message": "本音と建前ステージクリア！", "questions": [["母が『遅くなるなら連絡しなさい』と言うと、彼は『はいはい』と面倒そうに答えた。だが外出後、予定より十分遅れそうになった時点で、自分からメッセージを送った。", "口では面倒がっていても、母の心配は理解し約束を守ろうとしている。", "母の注意を全く聞いておらず、偶然連絡しただけである。", "母に怒られることだけを恐れ、自分の判断は何もない。", "外出を中止したいので、帰宅を早める相談をしている。", "『はいはい』だけなら反発だが、その後の自主的な連絡が本音や理解を示す。"], ["友人に『その髪型似合ってる』と言われた彼女は『適当なこと言わないで』と返した。その後、店の窓に映る髪を何度か確かめた。", "照れて否定したが、褒め言葉をうれしく受け止めている。", "褒め言葉が嘘だと思い、友人への不信感が強まっている。", "髪型が崩れていないかだけを心配している。", "友人にからかわれたと感じて怒っている。", "否定的な台詞の後に髪を確認する行動から、言葉を意識していることが分かる。"], ["先生が『無理なら今回は出なくてもいい』と言うと、彼は『別に出たいわけじゃないです』と答えた。翌朝、誰より早く練習場所に来ていた。", "本当は参加したいが、失敗や拒否を恐れて気持ちを隠している。", "参加する気はないが、先生に呼ばれたので仕方なく来た。", "早起きが得意なので、たまたま早く着いただけである。", "先生の言葉に腹を立て、練習を妨害しに来た。", "台詞と翌朝の行動が逆方向。行動の方が参加意欲を強く示す。"], ["祖母が作った料理を『ちょっと味濃いかも』と言った彼は、おかわりを聞かれると少し間を置いて『じゃあ少しだけ』と茶碗を差し出した。", "率直な感想はありつつ、料理そのものは気に入っている。", "祖母を傷つけないため、嫌いな料理を無理に食べ続けている。", "味が濃いことに強く腹を立てている。", "食事には関心がなく、断るのが面倒なだけである。", "批判とおかわりが両立しており、単純な好き嫌いではない。"], ["友人に負けた彼は『今日は譲ってやった』と笑った。帰宅後、その競技の動画を一本だけ見るつもりが、気づけば一時間見続けていた。", "悔しさを冗談で隠し、負けをきっかけに上達したいと思っている。", "本気で勝敗を気にしておらず、ただ動画を見るのが好きである。", "友人が不正をした証拠を探している。", "競技をやめるため、最後に動画を見納めしている。", "『譲った』は強がりと読め、後の学習行動が悔しさと向上心を補強する。"], ["父は息子の一人暮らしに『好きにすればいい』と言った。引っ越し当日、冷蔵庫には父が買った飲み物と簡単な食料がぎっしり入っていた。", "言葉では距離を置きながら、行動では息子を心配し支えている。", "一人暮らしに賛成しておらず、食料で引き止めようとしている。", "自分が食べるために買った物を置き忘れただけである。", "息子が料理できないことを責めている。", "ぶっきらぼうな台詞と具体的な準備の対比から、心配や愛情を読む。"], ["彼女は『別にあの人とは仲良くないよ』と言った。ところがその人が休んだ日は、授業中も何度か空席の方を見ていた。", "関係を軽く言っているが、実際には相手を気にかけている。", "相手が嫌いなので、いないことを確認して安心している。", "空席の場所に時計があるため見ていただけである。", "休んだ理由を先生に報告しようとしている。", "否定的な自己申告より、無意識に繰り返す視線が関心を示す。"], ["部長に『今日は休んでいいぞ』と言われ、彼は『ラッキー』と答えた。帰宅途中、部室の前を通ると足を止め、中の声をしばらく聞いていた。", "休める気楽さはありつつ、活動から外れる寂しさもある。", "部活動を嫌っており、辞める決心をしている。", "部室で悪口を言われていないか監視している。", "忘れ物を取りに戻るか迷っているだけである。", "『ラッキー』と足を止める行動のずれから、複数の本音を読む。"], ["母に褒められた彼女は『それくらい普通でしょ』と言った。その夜、その答案だけは机の端ではなく透明なファイルに入れた。", "平静を装っているが、褒められた結果を誇らしく感じている。", "答案の紙質が良いので保存しただけである。", "母の褒め方に不満があり、証拠として残している。", "点数を隠すため、人目につかないよう保管した。", "保存の仕方を変える行動が、その答案の特別さを示す。"], ["転校生に『困ったら聞いて』と言った彼は、その後友人に『別に世話係じゃないけど』と付け加えた。翌日、転校生が迷っていると真っ先に立ち上がった。", "人前では照れて距離を取るが、実際には助けたいと思っている。", "転校生に好かれたくて、計算して親切にしているだけである。", "世話を押しつけられたことに不満で、仕方なく動いている。", "友人に自分の親切を自慢するために行動している。", "発言は照れ隠しで、繰り返す援助行動が本心を示す。"], ["兄が家を出る朝、弟は『部屋広くなるから助かる』と言った。兄の車が見えなくなると、すぐ兄の机の椅子に座った。", "強がって軽く言ったが、兄がいなくなる寂しさを感じている。", "兄の部屋を早く自分のものにしたくて喜んでいる。", "椅子の座り心地を確かめたかっただけである。", "兄に対する怒りが残っている。", "台詞では利益を強調するが、去った直後に兄の場所へ行く行動は愛着を示す。"], ["友人から謝られ、彼女は『もう気にしてない』と答えた。翌日も普通に話したが、その話題だけになると別の話を始めた。", "関係は戻したいが、出来事そのものはまだ触れにくい。", "謝罪を完全に受け入れておらず、友人との関係も終わらせたい。", "出来事を本当に忘れ、話題が分からない。", "友人に仕返しする機会を待っている。", "普通に話す＝関係継続、話題を避ける＝傷が残る。二つを分けて読む。"], ["父の古い車について彼は『燃費悪いし、早く替えれば』と言った。買い替えが決まると、最後の日に自分から洗車した。", "欠点は理解していても、思い出のある車に愛着を感じている。", "買い替えに反対しており、父を説得し直そうとしている。", "新しい車が嫌いなので、古い車を残したいだけである。", "洗車代を節約したいと思っている。", "合理的な評価と感情的な愛着は両立する。最後の洗車がそれを示す。"], ["彼女は発表前に『全然緊張してない』と言い、友人を笑わせた。自分の順番が近づくと、同じ一文を小声で三度読み直した。", "周囲には平静を見せながら、自分では緊張を調整しようとしている。", "本当に緊張しておらず、暗記を楽しんでいる。", "友人に緊張を移すため、わざと明るく振る舞っている。", "原稿に誤字を見つけ、内容への不満を感じている。", "言葉より反復確認という行動が緊張を示す。"], ["祖父から『昔はもっと勉強した』と言われ、彼は『またその話？』と返した。自室へ戻ると、祖父が置いていった参考書を開いた。", "小言にはうんざりしつつ、祖父の言葉を完全には無視していない。", "祖父を見返すためだけに、怒りながら勉強している。", "参考書を返すため、状態を確認している。", "祖父の話には関心がなく、偶然本を開いただけである。", "口では拒むが、その直後の行動に影響を受けていることが表れる。"], ["友人に『来なくてもいいよ』と言われ、彼は『じゃあ行かない』と答えた。当日、その時間になると何度もスマホを見ていた。", "行かないと決めたものの、誘いが続くことや集まりの様子を気にしている。", "本当に行きたくなく、時間を確認して早く寝ようとしている。", "友人に怒っており、連絡を拒否する準備をしている。", "スマホの故障を心配しているだけである。", "決断後も時刻と連絡を気にする行動から、未練や期待が残る。"], ["先生が作品を展示すると言うと、彼は『別に名前出さなくていいです』と言った。展示初日、誰より先に掲示板の前を通った。", "注目されるのは照れくさいが、作品の評価は気になっている。", "作品を展示されたことに怒り、撤去しようとしている。", "自分の作品がどこにあるか分からず探しているだけである。", "他人の作品を批判するため見に行った。", "名前を出したくない＝無関心ではない。展示を確認する行動が関心を示す。"], ["母が旅行に誘うと、彼女は『どこでもいい』と言った。その夜、候補地の一つだけ天気予報と店を詳しく調べていた。", "希望を強く言わないだけで、行きたい場所はある。", "旅行自体には関心がなく、調査は学校課題のためである。", "母の候補に全部反対している。", "天気が悪ければ旅行を中止させたいと思っている。", "『どこでもいい』という表向きの譲歩と、具体的な調査に本音の希望が表れる。"], ["兄に『その服似合わない』と言われ、彼は『別にお前に見せるためじゃない』と返した。外出直前、別の上着に着替えた。", "反発しながらも、兄の意見を気にしている。", "兄の言葉に全く影響されず、気温だけで着替えた。", "兄と同じ服装になるのを避けたかった。", "服そのものが嫌いになり、二度と着ないと決めた。", "言葉では否定しても、直後の選択が意見の影響を示す。"], ["友人から『助かったよ』と言われた彼女は『たいしたことしてない』と答えた。帰宅後、同じ場面を思い出して一人で少し笑った。", "謙遜していたが、役に立てたことを内心うれしく思っている。", "友人の失敗を思い出して笑っている。", "自分の行動を後悔し、苦笑している。", "友人の感謝が大げさだと軽蔑している。", "対人場面では謙遜し、一人になってから喜びが表れている。"]]}, "lv8": {"title": "LV8 情景・象徴", "subtitle": "物・景色・距離の変化を意味につなげる", "trophy": "🔥🏆", "message": "情景・象徴ステージクリア！", "questions": [["葬儀の翌朝、家の庭には昨夜の雨粒が残っていた。雲の切れ間から光が差すと、彼は閉めていた窓を少しだけ開けた。", "悲しみの中で、少しずつ外の世界へ向き始める心情を重ねている。", "天気が回復したので、単に部屋の換気を始めたことだけを表す。", "亡くなった人を忘れ、完全に立ち直ったことを示す。", "雨が嫌いだったため、晴れたことだけを喜んでいる。", "雨→光、閉じた窓→少し開くという対応が、完全回復ではない小さな変化を象徴する。"], ["試合に敗れた帰り、グラウンドの白線は雨でほとんど消えていた。ただゴール前の一部だけがかすかに残っていた。彼はそこを踏まずに歩いた。", "敗北の記憶を大切に残し、次につなげようとする意識が表れている可能性。", "白線が滑りやすいので、転ばないよう避けただけである。", "試合そのものを忘れたいという強い拒絶だけを示す。", "ゴール前だけ整備が悪かったことへの不満を示す。", "消えかけた線が試合の余韻を、踏まない行動がその経験への特別な意識を示す。"], ["祖母の家を片づけると、棚の奥から止まった置き時計が出てきた。母は『捨てようか』と言ったが、父は答えず、時計のほこりだけを払った。", "言葉にせず、時計に結びつく思い出を残したい気持ちを表している。", "時計を修理して高く売ろうと考えている。", "母の片づけ方に腹を立て、作業を拒否している。", "ほこりが気になったので掃除しただけで、感情的意味はない。", "返事をせず、捨てる対象を丁寧に扱う行動が保存したい気持ちを暗示する。"], ["転校初日、彼女の机には誰かが置いた小さな折り紙の花があった。授業後、花は筆箱の横に置き直されていた。", "新しい場所への不安の中で、受け入れられた安心を少し感じ始めている。", "折り紙の花が邪魔なので、捨てる準備をしている。", "花を置いた相手を特定して問い詰めようとしている。", "授業に集中できず、机の物を並べ替えていただけである。", "捨てずに見える位置へ置き直す行為が、好意を受け取ったことを示す。"], ["父とけんかした夜、彼は机のライトだけをつけ、部屋の天井灯は消したままにした。翌朝、カーテンを開けると、床に細い光の帯が伸びた。", "閉じた気持ちの中にも、関係を修復する余地が生まれ始めたことを象徴しうる。", "電気代を節約したいという意識だけを描いている。", "父への怒りがさらに強くなったことを示す。", "朝日がまぶしく、カーテンを閉め忘れたことを示す。", "限定された灯りから外光へという変化は、心理の開きと対応させて読める。"], ["卒業後の教室。黒板はきれいに消されていたのに、隅に小さく書かれた日付だけが残っていた。彼はそれを消さずに教室を出た。", "終わりを受け入れつつ、思い出の痕跡を一部残したい心情が表れている。", "掃除を忘れただけで、特別な意味はない。", "日付を書いた人に腹を立て、先生に報告しようとしている。", "卒業を拒否し、教室に残りたいという意思だけを示す。", "全体は消えているのに一部だけ残す選択が、区切りと未練の両方を示す。"], ["家族で使っていた食卓を買い替えた。古い机を運び出したあと、床には脚の跡が四つ残っていた。母は新しい机を置く前に、その跡をしばらく見ていた。", "日常の中に積み重なった家族の時間を思い返している。", "床の傷に気づき、修理費だけを心配している。", "新しい机の大きさが合うか測っている。", "古い机を処分したことを完全に後悔している。", "家具そのものではなく、残った跡が過ぎた時間の象徴になっている。"], ["友人と仲直りした帰り道、雨はまだ降っていたが、彼女は傘を少し高く持ち上げた。", "問題は完全には消えていなくても、気持ちが軽くなったことを情景と動作で示している。", "雨が弱くなったことだけを示す客観的描写である。", "友人との関係をまだ拒絶していることを示す。", "傘が壊れて持ち方を変えただけである。", "雨が続く＝問題の余韻、傘を上げる＝視界や気持ちが開く、という組み合わせ。"], ["長く使った靴を捨てる日、彼は新しい靴を履いて玄関を出た。数歩進んでから戻り、古い靴の向きをそろえた。", "前へ進む決意と、過去への敬意や名残惜しさが共存している。", "新しい靴が合わず、古い靴に履き替えようとしている。", "家族に靴の置き方を注意されるのを恐れている。", "古い物を捨てることへの怒りだけを表している。", "新しい靴で出る＝前進、戻って整える＝過去を大切にする、という対比。"], ["祖父から受け継いだ木の椅子は、座面が少しきしんだ。家族は何度も買い替えを話したが、そのたび誰かが『まだ座れる』と言った。", "実用性だけでは説明できない家族の思い出が椅子に重なっている。", "家族全員が節約だけを最優先している。", "新しい椅子を選ぶのが面倒なため先延ばししている。", "椅子のきしむ音を家族が好んでいる。", "『まだ使える』を繰り返す背景に、物への愛着があると読むと自然。"], ["冬の朝、閉鎖された校舎の窓に一枚だけカーテンが残っていた。風が吹くたび、それだけがゆっくり揺れていた。", "人が去った場所に残る記憶や時間の余韻を強調している。", "カーテンの取り外し作業が未完了であることだけを説明する。", "校舎が危険であることを知らせる警告の役割を持つ。", "冬の風が強いことを読者に知らせるためだけの描写である。", "人の不在と、なお動く一枚のカーテンの対照が過去の気配を感じさせる。"], ["彼女は結果を待つ間、机の上の砂時計を何度もひっくり返していた。合否メールが届くと、砂時計には触れず、最後まで砂が落ちるのを見た。", "待つしかなかった時間が終わり、結果を受け止めようとする気持ちを象徴している。", "砂時計の故障を確認している。", "結果を見ずに時間をつぶそうとしているだけである。", "合否より砂時計に興味を持つようになった。", "反復していた操作をやめ、最後まで見届ける変化が心理的な区切りを示す。"], ["別れた友人からもらった植物は、しばらく水をやられずしおれていた。ある日、彼は枯れた葉を切り、新しい土に植え替えた。", "過去を消すのではなく、気持ちを整理して新しい形で受け入れようとしている。", "友人との関係を完全に復活させようとしている。", "植物を捨てる準備として手入れした。", "園芸そのものに急に興味を持っただけである。", "枯れた部分を切りつつ植物自体は残す行為が、整理と継続の両方を象徴する。"], ["夜の駅で彼を見送ったあと、ホームの表示は『回送』に変わった。彼女は表示を一度見上げてから、ゆっくり階段へ向かった。", "別れの場面が終わったことを受け入れ、日常へ戻ろうとする区切りを示す。", "次の電車が来ないことに怒っている。", "回送電車に乗れるか確認しているだけである。", "別れた相手への関心をすぐ失ったことを示す。", "『回送』への切り替わりが、二人の時間の終了と次への移行に重なる。"], ["かつて毎日遊んだ公園には、新しい遊具が増えていた。彼は喜んで写真を撮ったが、最後に昔からある一本の木だけを近くから撮った。", "変化を受け入れながらも、自分の記憶につながるものを大切にしている。", "新しい遊具が嫌いで、昔の公園に戻してほしいと思っている。", "木の種類を調べる課題がある。", "公園が変わったことに腹を立て、証拠写真を撮っている。", "新しい物も撮る＝変化の受容、古い木を特別に撮る＝記憶への愛着。"], ["病室を出る日、彼女はベッド脇のカレンダーから退院日だけを丸く切り抜き、残りはそのまま置いていった。", "長い入院生活の中で、退院という一日を特別な節目として残したい。", "カレンダーが不要なので、一部だけ再利用しようとしている。", "入院した日を忘れたいので、退院日だけを消した。", "病室の備品を持ち帰ること自体を楽しんでいる。", "一日だけ切り取る行為が、時間の中でその日を特別な意味に変えている。"], ["長いけんかのあと、二人は同じ道を帰った。最初は一人分ほど間を空けていたが、交差点で信号を待つうちに、その間隔は半分ほどになっていた。", "会話がなくても、関係が少しずつ修復に向かっていることを距離で表している。", "道が狭くなったため、仕方なく近づいただけである。", "まだ強く怒っており、距離を保とうとしている。", "信号が変わるのを急いでいるだけである。", "物理的距離の縮小が心理的距離の変化と対応している。"], ["祖母が亡くなってから、家の柱時計は一日に数分遅れるようになった。誰も直さず、その遅れを『おばあちゃん時間』と呼んだ。", "不完全な時計を通して、家族が祖母の存在を生活の中に残している。", "時計の修理方法を誰も知らないことだけを説明している。", "祖母が時間に遅れる人だったことを批判している。", "時計を正確に使う必要がない家族のだらしなさを表す。", "欠点を固有の呼び名で受け入れることで、物が記憶の象徴になっている。"], ["失敗した発表資料を彼は削除せず、『旧版』という名前をつけて保存した。その横に『次』という新しいファイルを作った。", "失敗を消すのでなく経験として残し、次へ進もうとしている。", "失敗作に未練があり、新しい発表には進めていない。", "パソコンの整理が苦手なのでファイルを消せない。", "失敗を他人に見せるため保存している。", "『旧版』と『次』が並ぶことで、過去の受容と前進を同時に示す。"], ["引っ越し先の部屋で、彼女は最初にカーテンを開けた。窓の外は知らない町だったが、机の上には前の学校でも使っていた小さな置物を置いた。", "新しい環境へ踏み出しながら、これまでの自分とのつながりも保とうとしている。", "新しい町を受け入れられず、前の生活だけに戻りたい。", "置物を処分する場所がないため机に置いただけである。", "外の景色より室内の飾りにしか興味がない。", "窓を開く＝新環境への姿勢、旧い置物＝過去との連続性。"]]}, "lv9": {"title": "LV9 難関物語文", "subtitle": "短い本文を最後まで読んで判断する", "trophy": "🔥🏆✨", "message": "難関物語文ステージクリア！", "questions": [["授業で発表を終えた美咲は、席に戻ると『もう二度とやりたくない』と小声で言った。隣の友人が『でも、最後のところ分かりやすかったよ』と言うと、美咲は返事をせずノートを閉じた。放課後、教室に誰もいなくなると、彼女はそのノートを開き、先生が丸をつけた箇所を指でなぞった。", "失敗した部分への恥ずかしさはあるが、認められた部分を支えに次へつなげようとしている。", "発表への嫌悪だけが残り、良かった点には全く関心がない。", "友人の言葉を信用せず、先生の採点ミスを探している。", "発表が成功したと思い込み、失敗を忘れようとしている。", "直後の『二度と』だけでなく、放課後に良かった箇所へ戻る行動まで読む必要がある。"], ["健太は父から借りた腕時計を修学旅行に持って行った。友人に『古くない？』と言われると『まあね』と笑った。旅行最終日、時計のベルトが外れかけているのに気づいた健太は、土産物を見る時間を削って修理店を探した。", "古さは認めながらも、父から借りた時計に特別な価値を感じている。", "友人に古いと言われたことが恥ずかしく、新しい時計に交換したい。", "旅行中に時間が分からなくなる不便だけを避けたい。", "父に壊したことを知られるのが怖く、叱責だけを避けたい。", "土産物より修理を優先した選択が、単なる実用品以上の価値を示す。"], ["沙耶は転校前、クラスの寄せ書きを『家で読む』と言って鞄に入れた。新幹線に乗っても開かなかった。家に着き、荷物をほどき終えた夜、ようやく封を切った。最初の一枚を読むと、彼女は次のページへ進まず、しばらく窓の外を見ていた。", "別れの実感が強くなるのを避けていたが、落ち着いてから向き合おうとした。", "寄せ書きに興味がなく、読むのを忘れていただけである。", "内容に悪口があると予想し、読むのを恐れていた。", "新しい家の景色に夢中になり、寄せ書きを読む必要を感じなかった。", "読むタイミングを遅らせたことと、読後に止まる反応から、別れへの感情の強さを読む。"], ["祖父は毎朝、誰も座らない縁側に座布団を二枚並べた。孫が『一枚でいいじゃん』と言うと、『日なたは広い方がいい』と答えた。数年前まで祖母が隣に座っていたことを、孫は知っていた。", "祖母の不在を直接語らず、以前の二人の時間を習慣として残している。", "二枚使う方が座り心地がよく、実用上そうしている。", "孫にも毎朝一緒に座ってほしいと強く命令している。", "祖母が使っていた座布団を処分できず困っているだけである。", "祖父の説明は表面的で、過去の習慣との重なりが含意を作っている。"], ["大会前、翔太は『勝てる気しかしない』と仲間を笑わせていた。試合会場に着くと、いつも先に履く右の靴ではなく、左からゆっくりひもを結び始めた。仲間が声をかけるまで、結び目を二度作り直した。", "強気な言葉とは別に、いつもと違う手順が出るほど緊張している。", "勝利を確信しており、靴ひもを丁寧に整える余裕がある。", "右足を痛めているため、左の靴から履いただけである。", "仲間に注目されるため、わざと動作を遅くしている。", "『いつもと違う』という差と反復動作が、強気な台詞の裏の緊張を示す。"], ["母は進学で家を出る娘に『部屋、すぐ物置にするからね』と言った。娘が笑うと、母も笑った。半年後、娘が帰省すると、机の上には出発前に置いていったペン立てがそのままあり、薄くほこりだけが積もっていた。", "冗談では手放すように言いながら、娘の場所をそのまま残していた。", "物置にするのを忘れていただけで、娘への感情とは関係ない。", "娘の荷物を片づけるのが面倒で放置していた。", "娘が戻って住むことを強く要求している。", "発言と半年後の部屋の状態のずれが、母の名残惜しさや愛情を示す。"], ["亮は友人から借りた漫画を返すとき、『面白かった』とは言わず『思ったより長かった』と言った。友人が『じゃあ続きはいらない？』と聞くと、『別に。貸したいなら読むけど』と答えた。翌日、彼は自分から『昨日の続き、持ってきた？』と聞いた。", "興味を素直に認めるのが照れくさく、言葉では控えめにしている。", "本当は漫画が嫌いだが、友人関係のため無理に読んでいる。", "長い漫画への不満が強く、早く終わりを知りたいだけである。", "友人が忘れ物をしていないか確認している。", "翌日の自主的な質問が、前日の控えめな発言より本当の関心を示す。"], ["合唱コンクールで最優秀を逃したクラスは静かだった。担任は『よくやった』と言って教室を出た。しばらくして、一人が机を軽くたたいて歌い出すと、何人かが続いた。最後には全員が、結果発表前より少し小さな声で最後まで歌った。", "悔しさを抱えたままでも、自分たちの努力や時間を肯定しようとしている。", "結果を気にしておらず、単に歌うことを楽しんでいる。", "担任への不満を示すため、わざと歌い直している。", "採点が間違いだと抗議する準備をしている。", "声が『少し小さい』点に悔しさが残りつつ、全員で歌い切る行動が受容を示す。"], ["父の転勤で引っ越すことになった直人は、『どこに住んでも同じだよ』と言った。引っ越し当日、トラックが出たあとも彼は空になった玄関に立ち、壁についた自分の身長の線をスマホで撮った。", "場所への執着はないふりをしながら、そこで過ごした時間への愛着を感じている。", "身長の記録を医師に見せるため写真を撮った。", "新居でも同じ線を再現するため、寸法だけを記録した。", "引っ越しに反対し、家を取り戻そうとしている。", "『どこでも同じ』と、最後に過去の痕跡を保存する行動の対比が鍵。"], ["真琴は仲の良い友人と同じ高校を受ける予定だった。友人が志望校を変えたと聞くと、『そっちの方が合ってるよ』とすぐ答えた。帰宅後、自分の志望校のパンフレットを閉じ、二校分の路線図を並べてしばらく眺めた。", "友人の選択を尊重しながら、離れることへの寂しさや自分の進路への迷いも生じている。", "友人に裏切られたと感じ、自分も必ず志望校を変えると決めた。", "友人と別の学校になることを喜び、一人で受験したいと思っている。", "電車の乗り換えだけが気になり、進路そのものには迷っていない。", "即座の肯定は相手への配慮、その後の比較行動は本人の心の揺れを示す。"], ["祖母が亡くなったあと、父は『使わない物は捨てよう』と片づけを進めた。古いエプロンを手にしたときだけ、父はゴミ袋を開いたまま動かなかった。母が何も言わず別の箱を差し出すと、父はそこへエプロンを入れた。", "合理的に片づけようとしていても、特定の品には思い出が強く結びついている。", "エプロンが高価なので売却するため別に保管した。", "父は片づけそのものに反対し始めた。", "母に指示されなければ何も判断できないことを示す。", "一貫した方針が一つの品で止まることが、その品の特別さを示す。"], ["先生から『最近、授業で発言しないね』と言われた彩は、『別に言うことないだけです』と答えた。その日の帰り、誰もいない教室で、黒板に残った今日の問いをノートへ写した。", "発言を避けてはいるが、問いそのものへの関心や考えは失っていない。", "授業内容が分からず、家で丸暗記しようとしている。", "先生への反抗心から、わざと発言を拒否しているだけである。", "ノートを提出する必要があり、形式的に写している。", "口頭参加の減少と学習関心の消失は同じではない。放課後の行動がそれを示す。"], ["友人に秘密を打ち明けられた悠斗は、その場では『そうなんだ』とだけ答えた。帰宅後、メッセージ欄に長い文章を書いたが送らずに消し、翌朝いつも通り『おはよう』と声をかけた。", "何を言うべきか迷った末、まず普段通り接することで相手を安心させようとしている。", "秘密に興味がなく、すぐ忘れたため普段通り接した。", "長文で友人を責めようとしたが、面倒になってやめた。", "秘密を他人に伝える文章を書いていた。", "書いて消す迷いと、翌朝の自然な接し方から、慎重な配慮を読む。"], ["部活動を引退した日、先輩は後輩に『明日から楽になるぞ』と笑った。翌朝、いつもの時間に目が覚めると、時計を見て一度起き上がり、そのまままた布団に横になった。", "解放感を口にしつつ、生活から部活動がなくなった空白も感じている。", "練習がなくなったことを純粋に喜び、二度寝を楽しんでいる。", "引退したことを忘れ、練習へ行こうとしていただけである。", "後輩への未練はなく、睡眠不足だけが問題である。", "習慣で起きる→再び横になる動作に、自由と空白の両方が表れる。"], ["弟が家を出たあと、兄は『静かになって最高』と言った。数日後、弟の部屋のドアが開いたままだと、通りすがりにそっと閉めた。部屋の中には入らなかった。", "弟の不在を意識しつつ、その空間や思い出に踏み込みすぎないようにしている。", "弟の部屋が嫌いなので、見えないようドアを閉めた。", "兄は弟が戻ることを拒否している。", "冷暖房効率を上げるためだけに閉めた。", "軽口とは別に、不在の部屋への扱いに複雑な感情が表れる。"], ["試験で自己最高点を取った里奈は、友人に『今回は簡単だっただけ』と言った。帰宅後、答案を机の前に貼ろうとして一度やめ、結局ファイルの一番前に入れた。", "自信を持ちたい気持ちはあるが、それを表に出すのは照れくさい。", "点数が高すぎて不正を疑われるのを恐れている。", "試験が簡単だったので、結果に価値を感じていない。", "答案を紛失しないことだけを目的に保管している。", "貼るのをやめる＝表立った誇示へのためらい、先頭に入れる＝本人にとっての特別さ。"], ["転勤から戻った教師が教室に入ると、生徒たちは大声で迎えた。一人だけ後ろの席で笑わずに座っていた生徒がいた。授業後、その生徒は誰もいなくなるのを待って『おかえりなさい』と小さく言った。", "再会を喜んでいるが、大勢の前で感情を表すのが苦手だった。", "教師の復帰を歓迎しておらず、形式的に挨拶した。", "他の生徒に反発し、わざと後から挨拶した。", "授業後まで教師に気づかなかった。", "集団場面と一対一場面で表現が変わる点から、感情の有無ではなく表し方の違いと読む。"], ["祖父の畑を継がないと決めた孫は、『自分には向いてない』と話した。最後の収穫の日、祖父が曲がった野菜を箱からよけると、孫は『それ、持って帰っていい？』と聞いた。", "畑を職業として継ぐ気はなくても、祖父との経験には愛着がある。", "やはり畑を継ぐ決心に変わったことを示す。", "形の悪い野菜の方がおいしいと思っているだけである。", "祖父の選別方法に反対し、作業を邪魔している。", "進路の選択と、思い出への愛着を分けて読む必要がある。"], ["文化祭の企画が失敗し、責任者の亮は『俺のせいだな』と言った。仲間が否定しても笑わなかった。片づけの最後、破れた看板から企画名の部分だけ切り取り、折って鞄に入れた。", "失敗への責任や悔しさを抱えながら、その経験自体は大切に残そうとしている。", "失敗を隠すため証拠を持ち帰った。", "仲間に責任を押しつける材料として保存した。", "企画名のデザインだけが気に入っていた。", "失敗した物の一部を保存する行為が、否定だけではない意味づけを示す。"], ["幼いころ苦手だったピアノの発表会場を、大学生になった彼は偶然通りかかった。『まだあるんだ』とつぶやき、そのまま通り過ぎたが、角を曲がる直前に看板を一枚撮った。", "苦い記憶も含めて、自分の過去の一部として受け止められるようになっている。", "今も強い恐怖があり、会場の証拠を残そうとしている。", "再び発表会に出るため、会場情報を記録した。", "建物のデザインに興味があるだけで、過去とは関係ない。", "立ち止まらず進む一方、写真は残す。距離を取りつつ過去を受容する姿勢と読める。"]]}, "lv10": {"title": "LV10 早慶チャレンジ", "subtitle": "どれもそれっぽい選択肢から最適解を選ぶ", "trophy": "👑🔥🏆", "message": "難関編コンプリート！ このまま慶應合格へ！", "questions": [["『それなら最初から言ってくれればよかったのに』と姉は言った。弟は謝ろうとしたが、姉はその言葉を遮って台所へ行った。しばらくして戻ってくると、弟の前に温め直した夕食を置き、『冷めるよ』とだけ言った。最も適切な姉の心情はどれか。", "腹立たしさは残るが、弟を突き放すほどではなく、世話をする気持ちも保っている。", "怒りは完全に消え、先ほどの言葉もすべて忘れている。", "弟を許すつもりはなく、食事を出すことで皮肉を伝えようとしている。", "弟の謝罪には関心がなく、家事の手順として食事を置いただけである。", "会話を遮る怒りと、温め直して出す配慮が同時に描かれている。どちらか一方に単純化しない。"], ["祖父は毎年、桜が咲くと同じ公園へ行った。祖母が亡くなった年も一人で出かけ、帰宅すると『今年は早かった』とだけ言った。家族が写真を見せてと言うと、『撮ってない』と答えたが、翌日スマホには一枚だけ、空のベンチの写真が残っていた。最も適切な解釈はどれか。", "祖母との記憶を意識しているが、それを家族には多く語らず自分の中で受け止めている。", "桜には興味を失い、たまたま空のベンチだけ撮影した。", "祖母がいない公園に怒りを感じ、二度と行かないと決めている。", "家族に心配されたくないので、祖母のことを完全に忘れたふりをしている。", "一人で例年の場所へ行き、唯一残したのが空のベンチという点が、語られない記憶を示す。"], ["クラス替えで親しい友人と離れた優奈は、新しいクラスで『知ってる人少ない方が気楽かも』と言った。その日の昼休み、新しい同級生に誘われると一緒に食べた。放課後、旧クラスの前を通った時だけ歩く速度が少し落ちた。最も適切なのはどれか。", "新しい環境へ適応しようとしている一方、以前の友人関係への名残惜しさも残っている。", "新しいクラスを心から歓迎し、旧クラスにはもう関心がない。", "旧友に戻りたいだけで、新しい同級生との交流はすべて演技である。", "クラス替えに怒っており、誰とも親しくなるつもりがない。", "新しい交流へ進む行動と、旧クラス前での速度変化を両方評価する。"], ["父は息子の作品を見て『前の方が好きだな』と言った。息子は返事をせず作品を片づけた。翌週、父が部屋に入ると、新作の横に前作も立てかけられていた。二つの作品の間には、小さなメモで『どこが違う？』と書かれていた。最も適切なのはどれか。", "父の言葉には傷つきつつも、評価を材料に自分の表現を考え直そうとしている。", "父の好みに合わせて作品を完全に元へ戻すと決めている。", "父の意見を否定するため、二作品を並べて反論の準備をしている。", "父に作品を見せることをやめ、メモは自分だけの記録として残した。", "沈黙＝拒絶とは限らない。後の比較行動から、言葉を受け止めて検討していると分かる。"], ["試合でミスをした直後、海斗はベンチで顔を上げなかった。監督が交代を告げると小さくうなずいた。試合後、誰より先に道具を片づけ、最後に自分がミスした場所へ戻って数歩だけ走った。最も適切なのはどれか。", "落ち込みや責任を感じながらも、失敗を具体的に確かめ次へつなげようとしている。", "交代への不満から、監督への抗議材料を探している。", "ミスを忘れたいので、同じ場所で別の記憶を作ろうとしている。", "自分だけが悪いと思い込み、競技をやめる決意を固めている。", "落ち込みだけなら場所へ戻る必要はない。確認行動に再挑戦への向きがある。"], ["『忙しいなら無理に来なくていいよ』という母のメッセージに、娘は『了解』とだけ返した。仕事を終えたのは面会時間の十分前だった。娘は駅へ向かいかけ、立ち止まり、コンビニで母の好きな飲み物を買って病院へ走った。最も適切なのはどれか。", "母に負担をかけたくない気遣いを受けつつ、それでも会いたい気持ちを優先した。", "母の言葉を命令と受け取り、仕方なく病院へ向かった。", "仕事から逃げたいので、病院を口実にした。", "飲み物を届ける用事だけが目的で、面会への気持ちは特にない。", "最初の簡潔な返信だけでは本心は決められず、時間ぎりぎりで向かう選択が会いたい気持ちを示す。"], ["転校した友人から『こっちは楽しいよ』と写真が届いた。拓也は『よかったじゃん』と返信し、スマホを伏せた。その後の授業ではいつも通りだったが、帰宅すると去年の集合写真を机の奥から出した。最も適切なのはどれか。", "友人の新生活を喜びながら、自分には別れの寂しさが残っている。", "友人が楽しそうなのが許せず、強い嫉妬だけを感じている。", "集合写真を送り返して関係を終わらせようとしている。", "学校では平気だったので、帰宅後の行動に感情的意味はない。", "相手への祝福と自分の寂しさは同時に成立する。集合写真が後者を補強する。"], ["母の誕生日、息子は『プレゼントとかいらないでしょ』と言った。母も『いらないよ』と笑った。夜、母が寝たあと、台所には息子が失敗して少し形の崩れたケーキが置かれていた。最も適切なのはどれか。", "照れから気持ちを言葉にしないが、行動では母を喜ばせたいと思っている。", "母に断られたので、ケーキ作りを後悔している。", "料理の練習が目的で、誕生日とは関係がない。", "高価な贈り物を買えないことへの罪悪感だけで作った。", "会話だけでなく、隠れて作った行動が本心を示す典型的なずれ。"], ["教師に『この作文はきれいにまとまりすぎている』と言われた杏は、帰宅後すぐ作文を直さなかった。翌朝、通学中に昨日削った一文を思い出し、教室に着くと真っ先にその一文を書き戻した。最も適切なのはどれか。", "指摘を受けて、自分らしさを削っていたことに気づき、表現を見直した。", "教師の評価に反発し、わざと文章を乱そうとしている。", "削った一文を暗記していたことを証明したい。", "締切に間に合わせるため、以前の文章へ機械的に戻した。", "『まとまりすぎ』という指摘と、削った自分の文を戻す行動がつながっている。"], ["大学へ進む兄が家を出る日、妹は『やっとゲーム独占できる』と言った。兄は笑って出発した。夜、妹はゲーム機をつけたが、対戦モードの画面でしばらく止まり、一人用を選んだ。最も適切なのはどれか。", "兄がいなくなる寂しさを軽口で隠していたことが、普段一緒に遊んだ場面で表れた。", "本当にゲームを独占できて満足しており、操作に迷っただけである。", "兄と対戦していつも負けていたので、一人用を喜んで選んだ。", "兄への怒りが残り、対戦モードを見るのも嫌になった。", "『独占』という利益より、共有していた行為ができない空白に心情が表れる。"], ["老犬が歩けなくなってから、父は『もう無理させるな』と言って散歩をやめた。けれど毎夕、散歩の時間になると玄関に座り、犬の首輪を手にしてから元の場所へ戻した。最も適切なのはどれか。", "犬を気遣って現実を受け入れつつ、以前の日常を失った寂しさを抱いている。", "散歩を再開するため、犬が立つのを待ち続けている。", "首輪を捨てるか迷っているだけで、犬への感情とは関係ない。", "自分が散歩できなくなった不満を犬に向けている。", "判断としては散歩をやめても、習慣と首輪への動作に喪失感が出ている。"], ["『この町は何もない』と言っていた青年が、就職で上京する朝、駅前の古い商店を一軒ずつスマホで撮った。母が『急がないと』と言うと、『分かってる』と答え、最後に駅名の看板も撮った。最も適切なのはどれか。", "町への不満はあっても、離れる段階で自分の原点としての愛着を自覚している。", "都会へ行くことをやめ、故郷に残る決意へ変わった。", "古い店の問題点をSNSで批判するため撮影した。", "写真が趣味なので、町への感情とは無関係である。", "評価としての不満と、離別時に生じる愛着は矛盾しない。撮影の選択が後者を示す。"], ["部長選挙で敗れた春樹は、当選した友人に『お前なら大丈夫』と言った。翌日の練習で友人が指示に迷うと、春樹は一度口を開きかけ、結局『どうする？』とだけ聞いた。最も適切なのはどれか。", "助けたい気持ちはあるが、新部長の立場を奪わないよう意識している。", "敗北を根に持ち、友人が失敗するのを待っている。", "自分の方が優秀だと示すため、わざと曖昧な質問をした。", "部活動への関心を失い、判断をすべて友人へ押しつけている。", "すぐ答えを与えず『どうする？』と問う点に、支援と尊重の両方がある。"], ["祖母から譲られた着物を、孫は『着る機会ないよ』と言って箱に戻した。数年後、自分の子どもの成人式の話題になると、孫は真っ先にその箱の場所を確認した。最も適切なのはどれか。", "実用性は低いと思っていても、家族の記憶を受け継ぐ物として価値を感じている。", "昔から着物を着たかったが、祖母の前では嘘をついていた。", "着物の市場価格が上がったので、売却を考え始めた。", "箱の中に別の品を保管したことを思い出しただけである。", "『機会がない』は当時の実用判断であり、後の行動が象徴的価値を示す。"], ["失恋した友人に、彼女は『忘れた方が楽だよ』と言った。友人が帰ったあと、自分も昔もらった手紙の箱を開け、すぐ閉じた。最も適切なのはどれか。", "相手への助言をしながら、自分にも簡単には整理できない過去があると感じている。", "友人の失恋話を聞いて、自分の元恋人と復縁したくなった。", "友人への助言が間違いだと気づき、謝罪しようとしている。", "手紙を処分するため中身を確認しただけである。", "他者への一般論と、自分の経験の複雑さが対照になっている。"], ["『もう子ども扱いしないで』と言った娘に、父は『分かった』と答えた。翌朝、父はいつものように弁当を作りかけて手を止め、代わりに空の弁当箱だけ机に置いた。最も適切なのはどれか。", "娘の自立を尊重しようとしながら、世話をやめることには寂しさや戸惑いもある。", "娘に腹を立て、弁当を作らないことで罰を与えている。", "弁当作りを面倒に感じていたので、これを機会にやめただけである。", "娘が料理できるか試して楽しんでいる。", "作りかけて止める動作が、単純な拒絶ではなく自立を尊重するためのためらいを示す。"], ["長年続けた店を閉める日、店主は『これで朝寝坊できる』と客に笑った。シャッターを下ろしたあと、一度帰りかけたが戻り、看板の文字を布で拭いた。それから鍵をかけた。最も適切なのはどれか。", "仕事から解放される気持ちと、店への愛着・別れの寂しさが同時にある。", "閉店を心から喜んでおり、看板掃除は習慣にすぎない。", "店を再開するつもりで、看板を保存しようとしている。", "客に閉店を惜しまれなかったことへ怒っている。", "冗談の解放感と、最後に看板を整える行動の愛着を両方読む。"], ["友人の結婚式で、彼は誰より大きな声で『おめでとう』と言った。帰宅後、スーツを脱ぐ前に一人暮らしの部屋の電気を全部つけた。最も適切な解釈はどれか。", "友人を心から祝いつつ、自分の生活との対比から寂しさも意識した可能性がある。", "友人の結婚を妬み、祝福はすべて演技だった。", "部屋が暗かったので、単に必要な電気をつけただけである。", "式で疲れて判断力を失い、無意味な行動をした。", "祝福と自己の寂しさは両立する。帰宅直後の行動は後者をほのめかす。"], ["先生から『答えは合っている。でも理由が書けていない』と言われた生徒は、点数だけ見ればクラス上位だった。帰宅後、正解した問題だけをもう一度解き直した。最も適切なのはどれか。", "結果に満足するより、理解の弱さを指摘された点を改善しようとしている。", "採点に納得できず、正解を証明するためやり直している。", "点数が高かったので、同じ問題   return EMPTY_STATE();
}
function save(s){
  const data=JSON.stringify(s);
  // Same URL + same key means an index.html update does NOT erase progress.
  localStorage.setItem(STATE_KEY,data);
  localStorage.setItem(SAFETY_KEY,data);
}
let state=getState(); if(!state.seen)state.seen={}; if(!state.wrongCount)state.wrongCount={}; let session=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function today(){return new Date().toISOString().slice(0,10)}
function isUnlocked(k){
  if(k==="lv1"||k==="showa"||k==="kobun"||k==="kotowaza") return true;
  const i=MAIN.indexOf(k); return i>0 && state.completed[MAIN[i-1]];
}
function countToday(){return state.logs.filter(x=>x.date===today()).length}
function accuracy(){if(!state.logs.length)return 0; return Math.round(state.logs.filter(x=>x.ok).length/state.logs.length*100)}
function trophies(){return Object.keys(state.completed).length}
function home(){
  const items=KEYS.map(k=>{
    const c=COURSES[k], open=isUnlocked(k), done=state.completed[k];
    return `<div class="course ${open?"":"locked"}">
      <div><span class="badge">${k.startsWith("lv")?(Number(k.slice(2))>=6?"難関":"MAIN"):"EX"}</span>${k.startsWith("lv")&&Number(k.slice(2))>=6?'<span class="newLabel">NEW</span>':''}
      <h3>${done?c.trophy+" ":""}${c.title}</h3><p>${c.subtitle}　全${COURSES[k].questions.length}問</p>
      <p style="margin-top:5px">${new Set(state.logs.filter(l=>l.course===k&&l.ok).map(l=>l.qid)).size} / ${COURSES[k].questions.length} 正解済み</p></div>
      <button class="go" ${open?"":"disabled"} onclick="${open?`startSet('${k}')`:""}">${done?"もう1セット":open?"10問スタート":"🔒"}</button>
    </div>`
  }).join("");
  document.getElementById("app").innerHTML=`
  <div class="top"><div class="brand">国語クエスト v3.2</div><button class="menuBtn" onclick="openMenu()">☰</button></div>
  <div class="homeTitle">今日も10問いこう 📚</div>
  <div class="sub">1セット10問。今までの記録はそのまま。難関編＋EXことわざ・故事成語150問を追加 📚</div>
  <div class="stats"><div class="stat"><b>${countToday()}</b>今日の回答</div><div class="stat"><b>${accuracy()}%</b>総正答率</div><div class="stat"><b>${trophies()}</b>トロフィー</div></div>
  ${items}`;
}
function startSet(key){
  const qs=COURSES[key].questions.map((x,i)=>({x,i}));
  const seen=new Set(state.seen[key]||[]);
  let unseen=qs.filter(o=>!seen.has(o.i));
  let chosen=[];
  if(unseen.length>=10){
    chosen=shuffle(unseen).slice(0,10);
  }else{
    chosen=shuffle(unseen).slice();
    const used=new Set(chosen.map(o=>o.i));
    const wc=state.wrongCount[key]||{};
    let rest=qs.filter(o=>!used.has(o.i)).sort((a,b)=>(wc[b.i]||0)-(wc[a.i]||0));
    let top=rest.slice(0,Math.min(30,rest.length));
    shuffle(top);
    for(const o of top){if(chosen.length<10&&!used.has(o.i)){chosen.push(o);used.add(o.i)}}
    if(chosen.length<10){
      for(const o of shuffle(rest.filter(o=>!used.has(o.i)))){if(chosen.length<10)chosen.push(o)}
    }
  }
  session={key,items:chosen,pos:0,score:0,wrong:[],answered:false,setNo:(state.sets[key]||0)+1};
  renderQ();
}
function renderQ(){
  const c=COURSES[session.key], obj=session.items[session.pos], x=obj.x;
  const advanced=session.key.startsWith("lv") && Number(session.key.slice(2))>=6;
  const opts=x.slice(1,5).map((t,i)=>({t,correct:i===0})); shuffle(opts);
  session.currentOpts=opts; session.answered=false;
  document.getElementById("app").innerHTML=`
  <div class="quiz ${advanced?"advancedQuiz":""}">
    <div class="top"><div><span class="badge">${c.title}</span> <span class="progress">${session.pos+1}/${session.items.length}</span></div><button class="menuBtn" onclick="openMenu()">☰</button></div>
    <div class="question">${x[0]}</div>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${letters[i]}</span><span>${o.t}</span></button>`).join("")}</div>
    <div class="explain" id="explain"><div class="small">答えをタップすると、正解でも解説が表示されます。</div></div>
    <button class="next" id="next" disabled onclick="nextQ()">${session.pos===session.items.length-1?"結果を見る":"次へ"}</button>
  </div>`;
}
function answer(i){
  if(session.answered)return; session.answered=true;
  const obj=session.items[session.pos], x=obj.x, opts=session.currentOpts, ok=opts[i].correct;
  const btn=[...document.querySelectorAll(".choice")];
  btn.forEach((b,j)=>{b.disabled=true;if(opts[j].correct)b.classList.add("correct")});
  if(!ok)btn[i].classList.add("wrong"); else session.score++;
  if(!ok)session.wrong.push(obj);
  if(!state.seen[session.key])state.seen[session.key]=[];
  if(!state.seen[session.key].includes(obj.i))state.seen[session.key].push(obj.i);
  if(!state.wrongCount[session.key])state.wrongCount[session.key]={};
  if(!ok)state.wrongCount[session.key][obj.i]=(state.wrongCount[session.key][obj.i]||0)+1;
  state.logs.push({date:today(),ts:Date.now(),course:session.key,qid:obj.i,ok});
  save(state);
  document.getElementById("explain").innerHTML=`<div class="result">${ok?"✅ 正解":"❌ ちがうよ〜"}</div><div>${x[5]}</div>`;
  document.getElementById("next").disabled=false;
}
function nextQ(){
  if(session.pos<session.items.length-1){session.pos++;renderQ()} else finish();
}
function finish(){
  state.sets[session.key]=(state.sets[session.key]||0)+1;
  const fullCourseDone = COURSES[session.key].questions.every((q,idx)=>state.logs.some(l=>l.course===session.key&&l.qid===idx&&l.ok));
  if(fullCourseDone) state.completed[session.key]=true;
  save(state);
  const c=COURSES[session.key], wrongUnique=[...new Map(session.wrong.map(o=>[o.i,o])).values()];
  document.getElementById("app").innerHTML=`
  <div class="top"><div class="brand">${c.title}</div><button class="menuBtn" onclick="openMenu()">☰</button></div>
  <div class="center">
    <div class="bigTrophy">${fullCourseDone?c.trophy:"🎯"}</div>
    <div class="score">${session.score} / ${session.items.length}</div>
    <div class="sub">${fullCourseDone?c.message:"1セット終了！"}</div>
    ${wrongUnique.length?`<div class="note">間違い ${wrongUnique.length}問。ここだけすぐ復習できます。</div>`:""}
    <div class="actionGrid">
      ${wrongUnique.length?`<button class="next" onclick="retryWrong()">間違いだけ復習</button>`:""}
      <button class="next" onclick="startSet('${session.key}')">もう1セット（10問）</button>
      <button class="next secondary" onclick="home()">コース一覧へ</button>
    </div>
  </div>`;
}
function retryWrong(){
  const uniq=[...new Map(session.wrong.map(o=>[o.i,o])).values()];
  if(!uniq.length)return;
  shuffle(uniq);
  session={...session,items:uniq,pos:0,score:0,wrong:[]};
  renderQ();
}
function makeBackupText(){
  return JSON.stringify({
    app:"kokugo-quest-v3",
    version:"3.1",
    exportedAt:new Date().toISOString(),
    state:state
  });
}
async function copyBackup(){
  const data=makeBackupText();
  try{
    await navigator.clipboard.writeText(data);
    alert("バックアップをコピーしたよ！\\nSafariなど別のブラウザで「バックアップから復元」を押して貼り付けてね。");
  }catch(e){
    // Clipboard permission can be restricted in some in-app browsers.
    window.prompt("この文字列をすべてコピーしてね",data);
  }
}
function restoreBackup(){
  const pasted=window.prompt("コピーしたバックアップを貼り付けてね");
  if(!pasted)return;
  try{
    const parsed=JSON.parse(pasted.trim());
    const restored=(parsed && parsed.app==="kokugo-quest" && parsed.state) ? parsed.state : parsed;
    if(!restored || !Array.isArray(restored.logs) || typeof restored.completed!=="object" || typeof restored.sets!=="object"){
      throw new Error("invalid");
    }
    if(!confirm("このバックアップの学習記録に復元しますか？\\n今このブラウザにある記録は上書きされます。"))return;
    state=restored;
    save(state);
    closeMenu();
    home();
    alert("復元できたよ！📚");
  }catch(e){
    alert("バックアップを読み込めなかったよ。コピーした文字列が途中で切れていないか確認してね。");
  }
}
function exportData(){
  const blob=new Blob([makeBackupText()],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kokugo-quest-v3-1-backup.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function resetData(){
  if(confirm("v3の学習記録をすべて消して最初からやり直しますか？\\nこの操作は元に戻せません。先にバックアップがおすすめです。")){
    localStorage.removeItem(STATE_KEY);
    localStorage.removeItem(SAFETY_KEY);
    state=getState();
    closeMenu();
    home();
  }
}
function openMenu(){
  document.getElementById("panel").innerHTML=`
    <h3>メニュー</h3>
    <button onclick="closeMenu();home()">🏠 コース一覧</button>
    <button onclick="copyBackup()">📋 バックアップをコピー</button>
    <button onclick="restoreBackup()">📥 バックアップから復元</button>
    <button onclick="exportData()">💾 JSONでバックアップ保存</button>
    <button onclick="alert('JSONをお母さんのChatGPTに送れば、正答率・苦手分野・復習状況などを分析できます')">📊 学習記録の分析について</button>
    <button onclick="resetData()">🗑 学習記録をリセット</button>
    <button onclick="closeMenu()">閉じる</button>`;
  document.getElementById("sheet").classList.add("open");
}
function closeMenu(){document.getElementById("sheet").classList.remove("open")}
home();
</script>
</body>
